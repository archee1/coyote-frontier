#region SpacePutt
- type: entity #needs recipe updates?
  id: ThrusterTulipMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: tulip thruster machine board
  description: A machine board for the MicroPutt TugMaster thruster.
    It is designed for low speed, high thrust, and light power use.
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: ThrusterTulip
    requirements:
      Capacitor: 3
