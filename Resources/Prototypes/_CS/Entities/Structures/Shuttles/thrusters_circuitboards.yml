#region Low Power
#mini located elsewhere
- type: entity
  id: SlowStrongThrusterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: MicroPutt TugMaster machine board
  description: A machine board for the MicroPutt TugMaster thruster.
    It is designed for low speed, high thrust, and light power use.
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: SlowStrongThruster
    requirements: # Frontier
      Capacitor: 3 # Frontier stackRequirements<requirements
- type: entity
  id: SlowWeakThrusterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: MicroPutt StationKeeper machine board
  description: A machine board for the MicroPutt StationKeeper thruster.
    It is designed for low speed, low thrust, and high efficiency.
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: SlowWeakThruster
    requirements: # Frontier
      Capacitor: 3 # Frontier stackRequirements<requirements

#region Medium Power
#mule located elsewhere
- type: entity
  id: FastWeakThrusterMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: TurboPutt Kobold machine board
  description: A machine board for the TurboPutt Kobold thruster.
    It is designed for high speed, low acceleration, and high power use.
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: FastWeakThruster
    requirements: # Frontier
      Capacitor: 5 # Frontier stackRequirements<requirements
    stackRequirements:
      Steel: 5

