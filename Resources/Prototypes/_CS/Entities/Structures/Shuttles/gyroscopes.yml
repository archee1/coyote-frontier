#Debug
- type: entity
  id: DebugGyroscope
  parent: BaseThruster
  suffix: DEBUG
  components:
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    baseThrust: 100
    thrust: 100
  - type: ApcPowerReceiver
    needsPower: false
    powerLoad: 0
  - type: Sprite
    sprite: _NF/Structures/Shuttles/gyroscope.rsi # Frontier: add _NF prefix
    snapCardinals: true
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
- type: entity
  id: DebugGyroscopeSecurity
  parent: DebugGyroscope
  name: gyroscope
  suffix: DEBUG, Security
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/gyroscope.rsi
    layers: *secGyroLayers
  - type: Machine
    board: GyroscopeSecurityMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container # FIXME: Why do these need to be defined here?  What's missing?
      machine_parts: !type:Container
- type: entity
  id: DebugGyroscopeNfsd
  parent: DebugGyroscopeSecurity
  suffix: DEBUG, NFSD
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/gyroscope.rsi
