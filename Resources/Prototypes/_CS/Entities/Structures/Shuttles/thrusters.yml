      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: SlowStrongThrusterMachineCircuitboard
  - type: StaticPrice
    price: 100
  - type: Thruster
    baseThrust: 200
    thrust: 132
    thrustPerPartLevel: [162, 202, 242, 282]
    damage:
      types:
        Heat: 40
  - type: ApcPowerReceiver
    powerLoad: 250
- type: entity
  id: SlowWeakThruster
  parent: Thruster
  name: MicroPutt StationKeeper thruster
  description: A weak, high-efficiency thruster designed for shuttles that only move when they absolutely need to.
    Has a low max speed and very low acceleration, but uses next to no power.
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers:
    - state: base_small
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_small
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: SlowWeakThrusterMachineCircuitboard
  - type: StaticPrice
    price: 100
  - type: Thruster
    baseThrust: 33
    thrust: 22
    thrustPerPartLevel: [28.6, 37, 45.4, 53.8] # its bad
    damage:
      types:
        Heat: 40
  - type: ApcPowerReceiver
