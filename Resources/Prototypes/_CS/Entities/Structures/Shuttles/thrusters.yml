#region Base
- type: entity
  id: BaseThruster
  parent: [ BaseStructureDynamic, ConstructibleMachine ]
  name: SpaceMutt Genera-M15 #Naming Format: Techgroup Name-[thrust][cW (centiwatts)]
  description: A thruster that allows a shuttle to move.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
    - type: Sprite
    - type: Appearance
    - type: ThrusterVisuals
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
    - type: Rotatable
      rotateWhileAnchored: true
    - type: AmbientSound
      enabled: false
      range: 4
      volume: -4
      sound:
        path: /Audio/Effects/shuttle_thruster.ogg
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 450
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:ChangeConstructionNodeBehavior
            node: machineFrame
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Electronic
    - type: Thruster # Top Speed is 20xThrust/baseThrust
      damage:
        types:
          Heat: 21 # Formula is 'thrust/10'
    - type: ApcPowerReceiver
      powerLoad: 1500
    - type: InteractionOutline
    - type: ExtensionCableReceiver
    - type: StaticPrice
      price: 300
    - type: GuideHelp
      guides:
      - ShuttleCraft
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: BasicDevice
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSink
      ports:
      - On
      - Off
      - Toggle
    - type: PirateBountyItem
      id: Thruster

#region T1 'basic' tech
- type: entity
  id: ThrusterT1Normal
  name: stock-P15 thruster
  description: An average basic stock space thruster, used to make shuttles go fast.
  parent: BaseThruster
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: ThrusterMachineCircuitboard
  - type: Thruster
    baseThrust: 100
    thrust: 130
    thrustPerPartLevel: [130, 169, 208, 260]
    damage:
      types:
        Heat: 13
  - type: ApcPowerReceiver
    powerLoad: 1500

