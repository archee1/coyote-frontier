#region Base Thruster
- type: entity
  id: BaseThruster
  parent: BaseStructureDynamic
  name: thruster
  description: A thruster that allows a shuttle to move.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
    - type: AmbientSound
      enabled: false
      range: 4
      volume: -4
      sound:
        path: /Audio/Effects/shuttle_thruster.ogg
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
    - type: Rotatable
      rotateWhileAnchored: true
    - type: Thruster
      damage:
        types:
          Heat: 26 # Formula is floor(20*(thrust/baseThrust))
    - type: ApcPowerReceiver
      powerLoad: 1500
    - type: InteractionOutline
    - type: Sprite
    - type: Appearance
    - type: ThrusterVisuals
    - type: ExtensionCableReceiver
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 450
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:ChangeConstructionNodeBehavior
            node: machineFrame
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Electronic
    - type: StaticPrice
      price: 300
    - type: GuideHelp
      guides:
      - ShuttleCraft
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: BasicDevice
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSink
      ports:
      - On
      - Off
      - Toggle
    - type: PirateBountyItem
      id: Thruster

#region Low Power
- type: entity
  id: SmallThruster
  parent: Thruster
  name: SpacePutt Mini thruster
  description: A minified version of the SpacePutt Force thruster, for mini shuttles.
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers:
    - state: base_small
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_small
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: SmallThrusterMachineCircuitboard
  - type: StaticPrice
    price: 100
  - type: Thruster
    baseThrust: 33
    thrust: 33
    thrustPerPartLevel: [42.9, 56.1, 69.3, 82.5]
    damage:
      types:
        Heat: 40
  - type: ApcPowerReceiver
    powerLoad: 500
- type: entity
  id: SlowStrongThruster
  parent: Thruster
  name: MicroPutt TugMaster thruster
  description: A slow yet powerful thruster, designed for low end civilian applications.
    Has a low max speed, but decent acceleration and light power use.
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi # Frontier: use _NF prefix
