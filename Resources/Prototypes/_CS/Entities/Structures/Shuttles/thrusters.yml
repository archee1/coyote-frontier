#region Base Thruster
- type: entity
  id: BaseThruster
  parent: [ BaseStructureDynamic, ConstructibleMachine ]
  name: SpaceMutt Genera-M15 #Naming Format: Techgroup Name-[thrust][cW (centiwatts)]
  description: A thruster that allows a shuttle to move.
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
    - type: Sprite
    - type: Appearance
    - type: ThrusterVisuals
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
    - type: Rotatable
      rotateWhileAnchored: true
    - type: AmbientSound
      enabled: false
      range: 4
      volume: -4
      sound:
        path: /Audio/Effects/shuttle_thruster.ogg
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 450
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
          - !type:DoActsBehavior
            acts: ["Destruction"]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:ChangeConstructionNodeBehavior
            node: machineFrame
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Electronic
    - type: Thruster # Top Speed is 20xThrust/baseThrust
      damage:
        types:
          Heat: 21 # Formula is floor(20*(thrust/baseThrust))-5
    - type: ApcPowerReceiver
      powerLoad: 1500
    - type: InteractionOutline
    - type: ExtensionCableReceiver
    - type: StaticPrice
      price: 300
    - type: GuideHelp
      guides:
      - ShuttleCraft
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: BasicDevice
    - type: WirelessNetworkConnection
      range: 200
    - type: DeviceLinkSink
      ports:
      - On
      - Off
      - Toggle
    - type: PirateBountyItem
      id: Thruster

#region SpacePutt
- type: entity
  id: ThrusterTulip
  parent: BaseThruster
  name: SpacePutt Tulip-H7
  description: A slow yet powerful thruster, designed for low end civilian applications.
    Has a low max speed, but decent acceleration and light power use.
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: SlowStrongThrusterMachineCircuitboard
  - type: StaticPrice
    price: 100
  - type: Thruster
    baseThrust: 250
    thrust: 200
    thrustPerPartLevel: [200, 260, 320, 400]
    damage:
      types:
        Heat: 11
  - type: ApcPowerReceiver
    powerLoad: 750

- type: entity
  id: ThrusterAnemone
  parent: BaseThruster
  name: SpacePutt Anemone-L1
  description: A weak, high-efficiency thruster designed for shuttles that only move when they absolutely need to.
    Has a low max speed and very low acceleration, but uses next to no power.
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers:
    - state: base_small
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust_small
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: SlowWeakThrusterMachineCircuitboard
  - type: StaticPrice
    price: 100
  - type: Thruster
    baseThrust: 40
    thrust: 35
    thrustPerPartLevel: [35, 45.5, 56, 70] # its bad
    damage:
      types:
        Heat: 12
  - type: ApcPowerReceiver
    powerLoad: 100

