#Security
- type: entity
  id: ThrusterRoseSecurity
  parent: Thruster
  name: SpaceMutt Rose-S20
  suffix: Security
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers: &secThrusterLayers
    - state: base_sec
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: ThrusterSecurityMachineCircuitboard
  - type: Destructible
    thresholds: &secDestructibleThresholds
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
  - type: Thruster
    baseThrust: 120
    thrust: 220
    thrustPerPartLevel: [ 220, 286, 352, 440 ]
    damage:
      types:
        Heat: 31
  - type: ApcPowerReceiver
    powerLoad: 2000

#NFSD
- type: entity
  id: ThrusterRoseNfsd
  parent: ThrusterRoseSecurity
  suffix: NFSD
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers: &nfsdThrusterLayers
    - state: base_nfsd
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: Machine
    board: ThrusterNfsdMachineCircuitboard
- type: entity
  id: ThrusterHelleboreNfsd
  parent: ThrusterSecurity
  name: SpaceJett Hellebore-S50
  suffix: NFSD
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers: *nfsdThrusterLayers
  - type: Machine
    board: ThrusterHelleboreNfsdMachineCircuitboard
  - type: Thruster
    baseThrust: 135
    thrust: 337.5
    thrustPerPartLevel: [ 337.5, 438.8, 540, 675 ]
    damage:
      types:
        Heat: 31
  - type: ApcPowerReceiver
    powerLoad: 5000

#Debug
- type: entity
  id: DebugThrusterSecurity
  parent: DebugThruster
  name: thruster
  suffix: DEBUG, Security
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers: *secThrusterLayers
  - type: Machine
    board: ThrusterSecurityMachineCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container # FIXME: Why do these need to be defined here?  What's missing?
      machine_parts: !type:Container
- type: entity
  id: DebugThrusterNfsd
  parent: DebugThrusterSecurity
  suffix: DEBUG, NFSD
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi
    layers: *nfsdThrusterLayers
  - type: Machine
    board: ThrusterNfsdMachineCircuitboard
